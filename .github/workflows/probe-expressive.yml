name: 探测 Expressive API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: 第四批精确签名
        shell: bash
        run: |
          set +e
          LOG=/tmp/api.log; : > "$LOG"
          say() { echo "$@" >> "$LOG"; }
          DL="https://dl.google.com/dl/android/maven2"
          curl -sSL --retry 3 -o /tmp/m3.aar "$DL/androidx/compose/material3/material3-android/1.5.0-beta02/material3-android-1.5.0-beta02.aar"
          curl -sSL --retry 3 -o /tmp/shapes.aar "$DL/androidx/graphics/graphics-shapes-android/1.0.1/graphics-shapes-android-1.0.1.aar"
          say "shapes.aar size=$(wc -c < /tmp/shapes.aar) magic=$(head -c 4 /tmp/shapes.aar | xxd -p)"
          mkdir -p /tmp/m3 /tmp/sh && cd /tmp/m3
          unzip -o -q /tmp/m3.aar classes.jar
          jar xf classes.jar
          cd /tmp/sh && unzip -o -q /tmp/shapes.aar classes.jar && jar xf classes.jar
          CP="/tmp/m3:/tmp/m3/classes.jar:/tmp/sh:/tmp/sh/classes.jar"
          say "===== ColorScheme expressive ====="
          javap -public -classpath "$CP" androidx.compose.material3.ColorSchemeKt 2>&1 | grep -i 'expressive' >> "$LOG"
          say "===== Typography emphasized ====="
          javap -public -classpath "$CP" androidx.compose.material3.Typography 2>&1 | grep -iE 'Emphasized|getDisplay|constructor' | head -30 >> "$LOG"
          say "===== TypographyKt ====="
          javap -public -classpath "$CP" androidx.compose.material3.TypographyKt 2>&1 | head -25 >> "$LOG"
          say "===== SplitButtonDefaults methods ====="
          javap -public -classpath "$CP" androidx.compose.material3.SplitButtonDefaults 2>&1 | grep -E 'public final void|Shapes ' | tail -20 >> "$LOG"
          say "===== AnimatedShapeState ====="
          javap -public -classpath "$CP" androidx.compose.material3.AnimatedShapeState 2>&1 | head -30 >> "$LOG"
          say "===== Morph ====="
          javap -public -classpath "$CP" androidx.graphics.shapes.Morph 2>&1 | head -22 >> "$LOG"
          say "===== RoundedPolygon ====="
          javap -public -classpath "$CP" androidx.graphics.shapes.RoundedPolygon 2>&1 | head -18 >> "$LOG"
          say "===== MaterialExpressiveThemeKt ====="
          javap -public -classpath "$CP" androidx.compose.material3.MaterialExpressiveThemeKt 2>&1 | head -20 >> "$LOG"
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/api.log').read_text(errors='replace').splitlines()
          chunk,idx=[],1
          for l in lines:
            if sum(len(x)+1 for x in chunk)+len(l)>5800:
              print('::notice title=EXP4-%d::%s'%(idx,'%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in chunk)))
              idx+=1; chunk=[]
            chunk.append(l)
          if chunk: print('::notice title=EXP4-%d::%s'%(idx,'%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in chunk)))
          PY
