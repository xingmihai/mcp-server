name: 探测 navigationevent API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 解析版本 + 精确签名
        shell: bash
        run: |
          set +e
          LOG=/tmp/api.log; : > "$LOG"
          say() { echo "$@" >> "$LOG"; }
          DL="https://dl.google.com/dl/android/maven2"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > /tmp/deps.txt 2>&1
          say "===== GRADLE navigationevent ====="
          grep -i 'navigationevent' /tmp/deps.txt | head -25 >> "$LOG"
          V=$(grep -i 'navigationevent:' /tmp/deps.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u | tail -1)
          say "RESOLVED=$V"
          [ -z "$V" ] && V="1.2.0"
          curl -sSL --retry 3 -o /tmp/core.aar "$DL/androidx/navigationevent/navigationevent-android/$V/navigationevent-android-$V.aar"
          curl -sSL --retry 3 -o /tmp/compose.aar "$DL/androidx/navigationevent/navigationevent-compose-android/$V/navigationevent-compose-android-$V.aar"
          say "core=$(wc -c < /tmp/core.aar) compose=$(wc -c < /tmp/compose.aar)"
          mkdir -p /tmp/c/core /tmp/c/compose
          (cd /tmp/c/core && unzip -o -q /tmp/core.aar classes.jar && jar xf classes.jar)
          (cd /tmp/c/compose && unzip -o -q /tmp/compose.aar classes.jar && jar xf classes.jar)
          CP="/tmp/c/core:/tmp/c/core/classes.jar:/tmp/c/compose:/tmp/c/compose/classes.jar"
          say "===== JAVAP FULL ====="
          for C in \
            androidx.navigationevent.NavigationEventTransitionState \
            'androidx.navigationevent.NavigationEventTransitionState$InProgress' \
            'androidx.navigationevent.NavigationEventTransitionState$Idle' \
            androidx.navigationevent.NavigationEventInfo \
            'androidx.navigationevent.NavigationEventInfo$None' \
            androidx.navigationevent.NavigationEventDispatcher \
            androidx.navigationevent.compose.NavigationEventState \
            androidx.navigationevent.compose.NavigationEventHandlerKt \
            androidx.navigationevent.compose.RememberNavigationEventStateKt \
            androidx.navigationevent.compose.LocalNavigationEventDispatcherOwner; do
            say "--- $C ---"
            javap -public -classpath "$CP" "$C" 2>&1 | head -40 >> "$LOG"
          done
          say "===== NavigationEventHandlerKt FULL ====="
          javap -public -classpath "$CP" androidx.navigationevent.compose.NavigationEventHandlerKt 2>&1 >> "$LOG"
          say "===== dispatcher transitionState ====="
          javap -public -classpath "$CP" androidx.navigationevent.NavigationEventDispatcher 2>&1 | grep -iE 'transition|getState|addHandler|PRIORITY' >> "$LOG"
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/api.log').read_text(errors='replace').splitlines()
          chunk,idx=[],1
          for l in lines:
            if sum(len(x)+1 for x in chunk)+len(l)>5500:
              print('::notice title=NEV3-%d::%s'%(idx,'%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in chunk)))
              idx+=1; chunk=[]
            chunk.append(l)
          if chunk: print('::notice title=NEV3-%d::%s'%(idx,'%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in chunk)))
          PY
