name: 探测 Expressive API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: 精确签名（第二批）
        shell: bash
        run: |
          set +e
          LOG=/tmp/api.log; : > "$LOG"
          say() { echo "$@" >> "$LOG"; }
          URL="https://dl.google.com/dl/android/maven2/androidx/compose/material3/material3-android/1.5.0-beta02/material3-android-1.5.0-beta02.aar"
          curl -sSL --retry 3 -o /tmp/m3.aar "$URL"
          mkdir -p /tmp/m3 && cd /tmp/m3
          unzip -o -q /tmp/m3.aar classes.jar
          jar xf classes.jar
          CP=$(find /tmp/m3 -name '*.jar' | tr '\n' ':')
          for c in \
            WavyProgressIndicatorDefaults WavyProgressIndicatorKt \
            MaterialShapes MaterialShapesKt 'MaterialShapes$Companion' \
            AnimatedShapeState ShapesKt ShapeDefaults \
            SplitButtonKt ToggleButtonKt TypographyKt ColorSchemeKt \
            MaterialExpressiveThemeKt ButtonShapes SplitButtonShapes; do
            out=$(javap -public -classpath "$CP" "androidx.compose.material3.$c" 2>/dev/null | head -28)
            if [ -n "$out" ]; then say "--- $c ---"; say "$out"; fi
          done
          say "===== MaterialShapes companion fields ====="
          javap -public -classpath "$CP" 'androidx.compose.material3.MaterialShapes$Companion' 2>/dev/null | head -60 >> "$LOG"
          say "===== graphics-shapes API ====="
          javap -public -classpath "$CP" androidx.graphics.shapes.RoundedPolygon 2>/dev/null | head -25 >> "$LOG"
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/api.log').read_text(errors='replace').splitlines()
          # 分 6 块，每块控制在 6000 字符以内，避免工作流注解 10 条上限
          chunk,idx=[],1
          for l in lines:
            if sum(len(x)+1 for x in chunk)+len(l)>5800:
              print('::notice title=EXP2-%d::%s'%(idx,'%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in chunk)))
              idx+=1; chunk=[]
            chunk.append(l)
          if chunk: print('::notice title=EXP2-%d::%s'%(idx,'%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in chunk)))
          PY
