name: 探测 navigationevent API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: POM 全文 + 版本试探 + 反编译
        shell: bash
        run: |
          set +e
          LOG=/tmp/api.log; : > "$LOG"
          say() { echo "$@" >> "$LOG"; }
          DL="https://dl.google.com/dl/android/maven2"
          curl -sSL --retry 3 -o /tmp/nav.pom "$DL/androidx/navigation/navigation-compose/2.10.2/navigation-compose-2.10.2.pom"
          say "===== POM FULL ====="
          cat /tmp/nav.pom >> "$LOG"
          say "===== VERSION PROBE ====="
          V=""
          for CAND in 1.0.0 1.0.1 1.0.2 1.0.3 1.1.0 1.1.1 1.2.0 1.3.0 2.10.2; do
            U="$DL/androidx/navigationevent/navigationevent-compose-android/$CAND/navigationevent-compose-android-$CAND.aar"
            curl -sSL --retry 1 -o /tmp/t.aar "$U"
            SZ=$(wc -c < /tmp/t.aar); MAG=$(head -c 4 /tmp/t.aar | xxd -p)
            say "$CAND size=$SZ magic=$MAG"
            if [ "$MAG" = "504b0304" ] && [ "$SZ" -gt 5000 ]; then V="$CAND"; cp /tmp/t.aar /tmp/nev-compose.aar; fi
          done
          say "RESOLVED=$V"
          if [ -n "$V" ]; then
            curl -sSL --retry 3 -o /tmp/nev-core.aar "$DL/androidx/navigationevent/navigationevent-android/$V/navigationevent-android-$V.aar"
            say "core size=$(wc -c < /tmp/nev-core.aar) magic=$(head -c 4 /tmp/nev-core.aar | xxd -p)"
            mkdir -p /tmp/cls/core /tmp/cls/compose
            (cd /tmp/cls/core && unzip -o -q /tmp/nev-core.aar classes.jar && jar xf classes.jar)
            (cd /tmp/cls/compose && unzip -o -q /tmp/nev-compose.aar classes.jar && jar xf classes.jar)
            say "===== ALL classes ====="
            find /tmp/cls -name '*.class' | sed 's#/tmp/cls/[^/]*/##; s#/#.#g; s#\.class##' | grep -v '\$' | sort >> "$LOG"
            say "===== JAVAP ====="
            CP="/tmp/cls/core:/tmp/cls/core/classes.jar:/tmp/cls/compose:/tmp/cls/compose/classes.jar"
            for C in $(find /tmp/cls -name '*.class' | sed 's#/tmp/cls/[^/]*/##; s#/#.#g; s#\.class##' | grep -v '\$' | sort); do
              case "$C" in
                *NavigationBackHandler*|*NavigationEventState*|*TransitionState*|*NavigationEventInfo*|*NavigationEvent|*NavigationEventHandler*|*NavigationEventDispatcher*|*NavigationEventPriority*|*NavigationEventKt*|*NavigationEventHandlerKt*)
                  out=$(javap -public -classpath "$CP" "$C" 2>&1 | head -26)
                  if [ -n "$out" ] && ! echo "$out" | grep -q 'class not found'; then say "--- $C ---"; say "$out"; fi ;;
              esac
            done
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/api.log').read_text(errors='replace').splitlines()
          chunk,idx=[],1
          for l in lines:
            if sum(len(x)+1 for x in chunk)+len(l)>5500:
              print('::notice title=NEV2-%d::%s'%(idx,'%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in chunk)))
              idx+=1; chunk=[]
            chunk.append(l)
          if chunk: print('::notice title=NEV2-%d::%s'%(idx,'%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in chunk)))
          PY
