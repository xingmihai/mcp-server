name: 自动预发行

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 串行执行，避免并发任务同时创建多个预发行
concurrency:
  group: auto-prerelease
  cancel-in-progress: false

jobs:
  build-and-prerelease:
    runs-on: ubuntu-latest
    # 签名密钥全部来自 prerelease 环境密钥（Environment secrets）
    environment: prerelease
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 解码签名密钥库
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          # 密码写入临时文件，避免出现在进程命令行里
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"
          chmod 600 "$RUNNER_TEMP/ks.pass" "$RUNNER_TEMP/key.pass"
          # 提前校验密钥库与别名是否匹配
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:file "$RUNNER_TEMP/ks.pass" \
            -alias "$KEY_ALIAS" > /dev/null

      - name: 构建 Release APK
        run: |
          set -euo pipefail
          # 仓库里的 local.properties 指向本地 SDK，CI 上覆盖掉（不提交）
          printf 'sdk.dir=%s\n' "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 对齐并使用环境密钥签名
        run: |
          set -euo pipefail
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find app/build/outputs/apk/release -name '*-unsigned.apk' -print -quit)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          fi
          test -n "$UNSIGNED"
          ALIGNED="$RUNNER_TEMP/app-aligned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          OUT="app/build/outputs/apk/release/mcp-server-prerelease.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "file:$RUNNER_TEMP/ks.pass" \
            --key-pass "file:$RUNNER_TEMP/key.pass" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$OUT" "$ALIGNED"
          "$BT/apksigner" verify --verbose "$OUT"
          # 清理临时密钥材料
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/ks.pass" "$RUNNER_TEMP/key.pass" "$ALIGNED"

      - name: 删除历史预发行（发布前清空，始终只留一个）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "删除旧预发行：$tag"
            gh release delete "$tag" --yes --cleanup-tag || echo "跳过 $tag（删除失败不影响后续）"
          done

      - name: 创建唯一预发行并上传已签名 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="prerelease-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "预发行 · ${GITHUB_SHA::7} · #${GITHUB_RUN_NUMBER}" \
            --notes "自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，提交 ${GITHUB_SHA}。仓库始终只保留最新一个预发行。" \
            "app/build/outputs/apk/release/mcp-server-prerelease.apk"
