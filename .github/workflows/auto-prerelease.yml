name: 自动预发行

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 串行执行，避免并发任务同时创建多个预发行
concurrency:
  group: auto-prerelease
  cancel-in-progress: false

jobs:
  build-and-prerelease:
    runs-on: ubuntu-latest
    # 签名材料全部来自 prerelease 环境密钥（Environment secrets）
    environment: prerelease
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: 检出代码（需完整历史以计算版本号）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 自动计算版本号
        id: base
        run: bash .github/scripts/version.sh

      - name: 确定本次版本与产物名
        id: ver
        env:
          CODE: ${{ steps.base.outputs.VERSION_CODE }}
          NEXT: ${{ steps.base.outputs.NEXT_VERSION }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VN="${NEXT}-pre.${RUN}"
          {
            echo "VERSION_CODE=$CODE"
            echo "VERSION_NAME=$VN"
            echo "APK=app/build/outputs/apk/release/mcp-server-${VN}.apk"
            echo "TAG=prerelease-${RUN}-${SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并签名 APK
        env:
          GRADLE_ARGS: -PappVersionCode=${{ steps.ver.outputs.VERSION_CODE }} -PappVersionName=${{ steps.ver.outputs.VERSION_NAME }}
          OUT_APK: ${{ steps.ver.outputs.APK }}
        run: bash .github/scripts/build-release-apk.sh

      - name: 删除历史预发行（发布前清空，始终只留一个）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | .tagName' |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "删除旧预发行：$tag"
            gh release delete "$tag" --yes --cleanup-tag || echo "跳过 $tag（删除失败不影响后续）"
          done

      - name: 创建唯一预发行并上传已签名 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.TAG }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "预发行 ${{ steps.ver.outputs.VERSION_NAME }} · #${GITHUB_RUN_NUMBER}" \
            --notes "版本名 ${{ steps.ver.outputs.VERSION_NAME }}，versionCode ${{ steps.ver.outputs.VERSION_CODE }}，构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，提交 ${GITHUB_SHA}。仓库始终只保留最新一个预发行。" \
            "${{ steps.ver.outputs.APK }}"
