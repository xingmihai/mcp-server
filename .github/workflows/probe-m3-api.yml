name: 探测 M3 API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: 读取 POM 依赖与版本
        shell: bash
        run: |
          set +e
          LOG=/tmp/probe.log; : > "$LOG"
          say() { echo "$@" >> "$LOG"; }
          DL="https://dl.google.com/dl/android/maven2"
          curl -sSL --retry 3 -o /tmp/m3.pom "$DL/androidx/compose/material3/material3-android/1.5.0-beta02/material3-android-1.5.0-beta02.pom"
          say "===== material3-android POM ====="
          grep -E '<(groupId|artifactId|version)>' /tmp/m3.pom | sed 's/^ *//' | head -160 >> "$LOG"
          say "===== graphics-shapes versions ====="
          curl -sSL --retry 3 "$DL/androidx/graphics/graphics-shapes/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' | tail -20 >> "$LOG"
          say "===== savedstate versions ====="
          curl -sSL --retry 3 "$DL/androidx/savedstate/savedstate-ktx/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' | tail -12 >> "$LOG"
          say "===== lifecycle-viewmodel versions ====="
          curl -sSL --retry 3 "$DL/androidx/lifecycle/lifecycle-viewmodel-ktx/maven-metadata.xml" \
            | grep -oE '<version>[^<]+</version>' | tail -12 >> "$LOG"
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/probe.log').read_text(errors='replace').splitlines()
          chunk,idx=[],1
          for l in lines:
            if sum(len(x)+1 for x in chunk)+len(l)>3000:
              print('::notice title=POM-%d::%s'%(idx,'%0A'.join(x.replace('%','%25') for x in chunk)))
              idx+=1; chunk=[]
            chunk.append(l)
          if chunk: print('::notice title=POM-%d::%s'%(idx,'%0A'.join(x.replace('%','%25') for x in chunk)))
          PY
